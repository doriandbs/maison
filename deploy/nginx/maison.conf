# Site nginx de Maison. Modèle : @DOMAINE@ et @PORT@ sont remplacés par installer.sh.
# Le HTTPS est ajouté ensuite par certbot (`certbot --nginx -d @DOMAINE@`), qui modifie ce
# fichier lui-même : redirection 80 → 443 et certificat.

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAINE@;

    # Taille maximale d'un document déposé (TAILLE_MAX_DOCUMENT_MO) plus une marge pour le formulaire.
    client_max_body_size 12m;

    access_log /var/log/nginx/maison.access.log;
    error_log /var/log/nginx/maison.error.log;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_set_header Host $host;
        # On ÉCRASE l'en-tête au lieu d'y ajouter ($proxy_add_x_forwarded_for) : l'application
        # lit sa première adresse pour la limitation de débit. Ajouter laisserait le client
        # choisir l'adresse qu'il veut.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
