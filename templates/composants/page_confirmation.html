{% extends "composants/page_etroite.html" %}
{% load i18n %}
{% block titre %}{{ titre }}{% endblock %}
{% block carte %}
<h1>{{ titre }}</h1>
<p><strong>{{ object }}</strong></p>
<p>{{ question }}</p>

</form>
{% endblock %}
